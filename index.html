<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Segurança: só roda script deste site (a biblioteca do mapa fica em vendor/ e
       carrega só quando o mapa abre). Conexões: só HTTPS (Supabase, Open-Meteo, MET Norway, wttr.in, OpenStreetMap). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#edf1ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1517" media="(prefers-color-scheme: dark)">
  <meta name="description" content="GuiaXpert — roteiros sob medida para a sua família, que funcionam sem internet.">
  <title>GuiaXpert</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="pular" href="#conteudo" data-t="pular">Pular para o conteúdo</a>
  <div id="app">
    <header class="topo">
      <div class="topo-esq">
        <button class="ic" id="bt-menu" type="button" aria-controls="gaveta" aria-expanded="false" data-ta="menu" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
        <div class="marca" id="marca" role="button" tabindex="0" data-ta="irInicio" aria-label="Ir para o Início">
          <img src="icone-192.png" alt="" width="28" height="28">
        </div>
        <button class="chip-contexto" id="chip" type="button" data-ta="ondeVoceEsta" aria-label="Onde você está" hidden></button>
      </div>
      <div class="topo-dir">
        <button class="ic" id="bt-idioma" type="button" data-ta="trocarIdioma" aria-label="Trocar idioma">EN</button>
        <button class="ic" id="bt-busca" type="button" data-ta="buscar" aria-label="Buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
        <button class="ic" id="bt-config" type="button" data-ta="configuracoes" aria-label="Configurações"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button>
        <button class="ic" id="bt-inicio" type="button" data-ta="inicio" aria-label="Início"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/><path d="M10.5 19v-4.5h3V19"/></svg></button>
        <button class="ic" id="bt-conta" type="button" data-ta="conta" aria-label="Conta"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.9-3.6 3.6-5.5 7-5.5s6.1 1.9 7 5.5"/></svg></button>
      </div>
    </header>

    <div class="fundo-gaveta" id="fundo-gaveta" hidden></div>
    <nav class="gaveta" id="gaveta" aria-labelledby="gaveta-titulo" hidden></nav>

    <main id="conteudo" tabindex="-1"></main>

    <nav class="barra" id="barra" aria-label="Atalhos"></nav>
  </div>

  <!-- ordem importa: dados e serviços antes da tela -->
  <script src="config.js"></script>
  <script src="js/textos.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/biometria.js"></script>
  <script src="js/cofre.js"></script>
  <script src="js/pacotes.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/contexto.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/importar.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/explorar.js"></script>
  <script src="js/clima.js"></script>
  <script src="js/descobrir.js"></script>
  <script src="js/conta.js"></script>
  <script src="js/nuvem.js"></script>
  <script src="js/gostos.js"></script>
  <script src="js/app.js"></script>
  <!-- módulo comum SolverONE (igual em todos os apps) e o ajuste deste app -->
  <script src="diretrizes.js"></script>
  <script src="diretrizes-config.js"></script>
</body>
</html>
