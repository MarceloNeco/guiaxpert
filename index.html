<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- Segurança: só roda script deste site (a biblioteca do mapa fica em vendor/ e
       carrega só quando o mapa abre). Conexões: só HTTPS (Supabase, Open-Meteo, MET Norway, wttr.in, OpenStreetMap). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#edf1ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1517" media="(prefers-color-scheme: dark)">
  <meta name="description" content="GuiaXpert — roteiros sob medida para a sua família, que funcionam sem internet.">
  <title>GuiaXpert</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- abertura: CSS crítico aqui no <head> para a colagem aparecer antes de o resto carregar -->
  <style>
    #abertura { position: fixed; inset: 0; z-index: 200; background: #13202a radial-gradient(ellipse at 50% 52%, #24404c, #13202a 70%); overflow: hidden; display: grid; place-items: center; transition: opacity .5s ease; }
    #abertura.sai { opacity: 0; pointer-events: none; }
    .ab-colagem { position: absolute; inset: 0; }
    .ab-f { position: absolute; left: 0; right: 0; overflow: hidden; }
    .ab-f img { width: 100%; height: 100%; object-fit: cover; display: block; animation: ab-kb 14s ease-in-out infinite alternate; transform-origin: center; }
    /* celular (retrato): 2 fotos em cima e 2 embaixo, fundidas (sem linha); o meio fica calmo para o ícone, sem atração escondida atrás dele */
    .ab-f:nth-child(1) { top: 0; height: 28%; -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent); mask-image: linear-gradient(to bottom, #000 72%, transparent); }
    .ab-f:nth-child(2) { top: 18%; height: 27%; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 26%, #000 74%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 26%, #000 74%, transparent); }
    .ab-f:nth-child(3) { top: 63%; height: 24%; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 26%, #000 74%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 26%, #000 74%, transparent); }
    .ab-f:nth-child(4) { bottom: 0; height: 24%; -webkit-mask-image: linear-gradient(to top, #000 72%, transparent); mask-image: linear-gradient(to top, #000 72%, transparent); }
    .ab-cristo img { object-position: 66% 42%; } .ab-eiffel img { object-position: 50% 45%; }
    .ab-coliseu img { object-position: 42% 45%; } .ab-machu img { object-position: 30% 45%; animation-direction: alternate-reverse; }
    .ab-eiffel img { animation-direction: alternate-reverse; }
    /* desktop/notebook (paisagem): 4 colunas lado a lado, fundidas nas laterais */
    @media (orientation: landscape) {
      .ab-f { top: 0; bottom: 0; height: auto !important; left: auto; right: auto; }
      .ab-f:nth-child(1) { top: 0; bottom: 0; left: 0; width: 31%; -webkit-mask-image: linear-gradient(to right, #000 72%, transparent); mask-image: linear-gradient(to right, #000 72%, transparent); }
      .ab-f:nth-child(2) { top: 0; bottom: 0; left: 21%; width: 35%; -webkit-mask-image: linear-gradient(to right, transparent, #000 26%, #000 74%, transparent); mask-image: linear-gradient(to right, transparent, #000 26%, #000 74%, transparent); }
      .ab-f:nth-child(3) { top: 0; bottom: 0; left: 46%; width: 35%; -webkit-mask-image: linear-gradient(to right, transparent, #000 26%, #000 74%, transparent); mask-image: linear-gradient(to right, transparent, #000 26%, #000 74%, transparent); }
      .ab-f:nth-child(4) { top: 0; bottom: 0; right: 0; width: 30%; -webkit-mask-image: linear-gradient(to left, #000 72%, transparent); mask-image: linear-gradient(to left, #000 72%, transparent); }
      .ab-cristo img { object-position: 64% 50%; } .ab-eiffel img { object-position: 50% 55%; }
      .ab-coliseu img { object-position: 38% 50%; } .ab-machu img { object-position: 24% 50%; }
    }
    /* véu: escurece de leve o centro para o ícone e o nome destacarem */
    .abertura-veu { position: absolute; inset: 0; background: linear-gradient(rgba(8,16,22,.08), rgba(8,16,22,.08) 36%, rgba(8,16,22,.42) 46%, rgba(8,16,22,.42) 62%, rgba(8,16,22,.08) 72%, rgba(8,16,22,.14)); }
    @media (orientation: portrait) { .abertura-marca { transform: translateY(2.5vh); } }
    @media (orientation: landscape) { .abertura-veu { background: radial-gradient(ellipse 26% 34% at 50% 54%, rgba(8,16,22,.66) 0, rgba(8,16,22,.36) 45%, rgba(8,16,22,0) 100%), linear-gradient(rgba(8,16,22,.10), rgba(8,16,22,.18)); } }
    .abertura-marca { position: relative; display: grid; justify-items: center; gap: .55rem; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.65); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .abertura-marca img { width: 6.5rem; height: 6.5rem; border-radius: 28%; box-shadow: 0 14px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.12); }
    .abertura-marca strong { font-size: 2.1rem; font-weight: 800; letter-spacing: -.02em; }
    .abertura-marca span { font-size: 1.05rem; opacity: .95; }
    .abertura-marca .ab-x { font-weight: 900; color: #ffb070; font-size: 1em; opacity: 1; }
    @keyframes ab-kb { from { transform: scale(1); } to { transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .ab-f img { animation: none; } }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- abertura: colagem de cartões-postais (Cristo, Torre Eiffel, Coliseu, Machu Picchu) fundidos + marca, enquanto o app carrega (some sozinha) -->
  <div id="abertura" aria-hidden="true"><div class="ab-colagem"><div class="ab-f ab-cristo"><img alt="" decoding="async" fetchpriority="high" src="img/fundos/cristo-640.webp" srcset="img/fundos/cristo-640.webp 640w, img/fundos/cristo-1280.webp 1280w" sizes="(orientation: landscape) 35vw, 100vw"></div><div class="ab-f ab-eiffel"><img alt="" decoding="async" fetchpriority="high" src="img/fundos/eiffel-640.webp" srcset="img/fundos/eiffel-640.webp 640w, img/fundos/eiffel-1280.webp 1280w" sizes="(orientation: landscape) 35vw, 100vw"></div><div class="ab-f ab-coliseu"><img alt="" decoding="async" fetchpriority="high" src="img/fundos/coliseu-640.webp" srcset="img/fundos/coliseu-640.webp 640w, img/fundos/coliseu-1280.webp 1280w" sizes="(orientation: landscape) 35vw, 100vw"></div><div class="ab-f ab-machu"><img alt="" decoding="async" fetchpriority="high" src="img/fundos/machu-640.webp" srcset="img/fundos/machu-640.webp 640w, img/fundos/machu-1280.webp 1280w" sizes="(orientation: landscape) 35vw, 100vw"></div></div><div class="abertura-veu"></div>
    <div class="abertura-marca"><img src="icone-192.png" alt="" width="104" height="104"><strong>Guia<span class="ab-x">X</span>pert</strong><span>Seu guia, do seu jeito</span></div></div>
  <!-- fundo discreto com a foto do dia (só nas telas de leitura) -->
  <img id="fundo-foto" alt="" aria-hidden="true" decoding="async">
  <a class="pular" href="#conteudo" data-t="pular">Pular para o conteúdo</a>
  <div id="app">
    <header class="topo">
      <div class="topo-esq">
        <button class="ic" id="bt-menu" type="button" aria-controls="gaveta" aria-expanded="false" data-ta="menu" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
        <div class="marca" id="marca" role="button" tabindex="0" data-ta="irInicio" aria-label="Ir para o Início">
          <img src="icone-192.png" alt="" width="28" height="28">
        </div>
        <button class="chip-contexto" id="chip" type="button" data-ta="ondeVoceEsta" aria-label="Onde você está" hidden></button>
      </div>
      <div class="topo-dir">
        <button class="ic" id="bt-idioma" type="button" data-ta="trocarIdioma" aria-label="Trocar idioma">EN</button>
        <button class="ic" id="bt-busca" type="button" data-ta="buscar" aria-label="Buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
        <button class="ic" id="bt-config" type="button" data-ta="configuracoes" aria-label="Configurações"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button>
        <button class="ic" id="bt-inicio" type="button" data-ta="inicio" aria-label="Início"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/><path d="M10.5 19v-4.5h3V19"/></svg></button>
        <button class="ic" id="bt-conta" type="button" data-ta="conta" aria-label="Conta"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.9-3.6 3.6-5.5 7-5.5s6.1 1.9 7 5.5"/></svg></button>
      </div>
    </header>

    <div class="fundo-gaveta" id="fundo-gaveta" hidden></div>
    <nav class="gaveta" id="gaveta" aria-labelledby="gaveta-titulo" hidden></nav>

    <main id="conteudo" tabindex="-1"></main>

    <nav class="barra" id="barra" aria-label="Atalhos"></nav>
  </div>

  <!-- ordem importa: dados e serviços antes da tela -->
  <script src="js/abertura.js"></script>
  <script src="config.js"></script>
  <script src="js/textos.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/biometria.js"></script>
  <script src="js/digital.js"></script>
  <script src="js/barras.js"></script>
  <script src="js/cofre.js"></script>
  <script src="js/pacotes.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/contexto.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/importar.js"></script>
  <script src="js/guia.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/explorar.js"></script>
  <script src="js/clima.js"></script>
  <script src="js/descobrir.js"></script>
  <script src="js/destino.js"></script>
  <script src="js/conta.js"></script>
  <script src="js/nuvem.js"></script>
  <script src="js/gostos.js"></script>
  <script src="js/app.js"></script>
  <!-- módulo comum SolverONE (igual em todos os apps) e o ajuste deste app -->
  <script src="diretrizes.js"></script>
  <script src="diretrizes-config.js"></script>
</body>
</html>
